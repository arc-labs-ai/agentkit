site_name: agentkit
site_description: A low-level, composable framework for agentic-AI features in Python.
site_url: https://arc-labs-ai.github.io/agentkit/
repo_url: https://github.com/arc-labs-ai/agentkit
repo_name: arc-labs-ai/agentkit
edit_uri: edit/main/docs/
copyright: Copyright &copy; Arc Labs

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

validation:
  omitted_files: ignore
  absolute_links: ignore
  unrecognized_links: warn
  anchors: warn

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true
      enable_git_follow: false
      strict: false
      type: date
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_inheritance_diagram: false
            show_bases: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            heading_level: 2
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tilde
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Why: why.md
  - Getting started: getting-started.md
  - Cheatsheet: cheatsheet.md
  - Tutorial: tutorial.md
  - Concepts:
      - Kernel: concepts/kernel.md
      - Runtime: concepts/runtime.md
      - Capabilities: concepts/capabilities.md
      - Agents: concepts/agents.md
      - Prompts: concepts/prompts.md
      - Middlewares: concepts/middlewares.md
  - Anti-patterns: anti-patterns.md
  - Recipes:
      - Overview: recipes/index.md
      - Human-in-the-loop tool approval: recipes/hitl-tool-approval.md
      - Resume from a checkpoint after a crash: recipes/resume-after-crash.md
      - Cap spend with Budget and Quota: recipes/spend-budget-and-quota.md
      - Parallel agents with cooperative cancellation: recipes/parallel-agents-with-cancellation.md
      - Write a custom middleware: recipes/custom-middleware.md
      - Wire OpenTelemetry: recipes/otel-tracing-and-metrics.md
      - Plug the claude CLI into FastAPI code-gen: recipes/claude-cli-fastapi-code-gen.md
      - Consume MCP tools from an agent: recipes/mcp-tools.md
  - Migrating:
      - Overview: migrating/index.md
      - From LangChain: migrating/from-langchain.md
      - From vanilla asyncio: migrating/from-vanilla-asyncio.md
  - API reference:
      - agents: api-reference/agents.md
      - runtime: api-reference/runtime.md
      - kernel: api-reference/kernel.md
      - capabilities: api-reference/capabilities.md
      - prompts: api-reference/prompts.md
      - middlewares: api-reference/middlewares.md
      - context: api-reference/context.md
      - memory: api-reference/memory.md
      - tools: api-reference/tools.md
      - skills: api-reference/skills.md
      - testing: api-reference/testing.md
      - adapters: api-reference/adapters.md
  - Examples: examples.md
  - Contributing: contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/arc-labs-ai/agentkit
  generator: false
