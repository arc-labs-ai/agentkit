[project]
name = "arc-agentkit"
version = "0.1.0"
description = "A low-level, async-first base framework for agentic AI — one runtime with opinion-free primitives and composable cross-cutting concerns."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Arc Labs", email = "hello@arc-labs.ai" }]
maintainers = [{ name = "Arc Labs" }]
keywords = ["agents", "llm", "ai", "agentic", "framework", "async", "openai", "anthropic", "tool-use"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/arc-labs-ai/agentkit"
Documentation = "https://arc-labs-ai.github.io/agentkit/"
Repository = "https://github.com/arc-labs-ai/agentkit"
Issues = "https://github.com/arc-labs-ai/agentkit/issues"
Changelog = "https://github.com/arc-labs-ai/agentkit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
http = ["httpx[http2]>=0.27"]
fast = ["orjson>=3.10"]
observability = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
postgres = [
    "asyncpg>=0.29",
    "pgvector>=0.2",
]
redis = [
    "redis>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agentkit"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
# Tests idiomatically use in-body imports (module patching), lambdas,
# broad exception assertions, and mutable defaults for factory shorthand.
"tests/**" = ["E402", "E501", "E731", "E741", "B008", "B011", "B015", "B017", "ASYNC109"]
# Package __init__.py files re-export the public surface — flake8 rules
# that assume every import is used-inline don't fit.
"agentkit/**/__init__.py" = ["F401", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true

# Optional third-party integrations are imported behind `try/except ImportError`.
# When the extra isn't installed there's no stub to load — that's the whole
# point of the guard, not a real type error.
[[tool.mypy.overrides]]
module = ["pydantic", "pydantic.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10.9",
]
