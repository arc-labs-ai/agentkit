[project]
name = "arc-agentkit"
version = "0.1.0"
description = "A low-level, async-first base framework for agentic AI — one runtime with opinion-free primitives and composable cross-cutting concerns."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Arc Labs", email = "hello@arc-labs.ai" }]
maintainers = [{ name = "Arc Labs" }]
keywords = ["agents", "llm", "ai", "agentic", "framework", "async", "openai", "anthropic", "tool-use"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/arc-labs-ai/agentkit"
Documentation = "https://arc-labs-ai.github.io/agentkit/"
Repository = "https://github.com/arc-labs-ai/agentkit"
Issues = "https://github.com/arc-labs-ai/agentkit/issues"
Changelog = "https://github.com/arc-labs-ai/agentkit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
http = ["httpx[http2]>=0.27"]
fast = ["orjson>=3.10"]
observability = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
postgres = [
    "asyncpg>=0.29",
    "pgvector>=0.2",
]
redis = [
    "redis>=5.0",
]
mcp = ["mcp>=1.28,<2"]

[tool.hatch.build.targets.wheel]
packages = ["agentkit"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
# Tests idiomatically use in-body imports (module patching), lambdas,
# broad exception assertions, and mutable defaults for factory shorthand.
"tests/**" = ["E402", "E501", "E731", "E741", "B008", "B011", "B015", "B017", "ASYNC109"]
# Package __init__.py files re-export the public surface — flake8 rules
# that assume every import is used-inline don't fit.
"agentkit/**/__init__.py" = ["F401", "E402"]

# ── pytest ───────────────────────────────────────────────────────────────────
# The suite is the contract for an open-source framework other people build on,
# so the runner is configured to FAIL on the things that normally slip through
# silently rather than to be pleasant.
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    # A mistyped marker (`@pytest.mark.asyncioo`) is a test that silently never
    # runs the way its author thought. Unknown markers are errors.
    "--strict-markers",
    # An unknown key in THIS config block is an error, not a shrug — a typo'd
    # setting reads as "strictness enabled" while doing nothing.
    "--strict-config",
    # Import test modules by path, not by mutating sys.path. Keeps two
    # same-named test modules in different directories from shadowing.
    "--import-mode=importlib",
    # Show the slowest tests; a unit suite that starts sleeping is a suite
    # that will start flaking.
    "--durations=10",
]

# No single test may hang the suite. This is not hypothetical: a mutation run
# that removed the elicitation deadline turned a test whose fake asker sleeps
# for an hour into an hour-long CI job. A hung test must fail fast and name
# itself, not burn a runner. Individual slow tests opt out with
# `@pytest.mark.timeout(n)`.
timeout = 60
timeout_method = "thread"

# An unmarked async test is the sharpest silent hole in an async codebase:
# pytest-asyncio skips it with a warning and the suite still reports green.
asyncio_mode = "strict"

# `xfail` without `strict` lets a test that STARTS PASSING stay marked broken,
# so the fix is never noticed and the marker never removed.
xfail_strict = true

# Every warning is an error. This is the setting that would have caught the
# framework's own "output schema declared but no output_coerce()" warning the
# moment it started firing in six unrelated tests, instead of it scrolling past
# as green output. Allowances below are narrow and each says why.
filterwarnings = [
    "error",
    # Third-party deprecations we do not control and must not fail CI on.
    # Scoped to the emitting module so our own DeprecationWarnings stay fatal.
    "default::DeprecationWarning:pydantic.*",
    "default::DeprecationWarning:attr.*",
    "default::DeprecationWarning:attrs.*",
]

# Declared so `--strict-markers` has something to check against.
markers = [
    "asyncio: an async test driven by pytest-asyncio",
    "integration: needs a real backend (postgres / redis / a provider key)",
    "slow: takes more than a second; excluded from the fast inner loop",
]

# ── coverage ─────────────────────────────────────────────────────────────────
# Measured on the LIBRARY only. Including `tests/` inflates the number with the
# tests' own executed lines and hides gaps in the code that ships.
[tool.coverage.run]
source = ["agentkit"]
branch = true          # line coverage alone calls a half-tested `if` covered
parallel = true

[tool.coverage.report]
# A ratchet, not an aspiration: raise it when it is comfortably exceeded, never
# lower it to make a red build green. Set just under the measured baseline so
# a regression fails while honest refactors do not.
# 85 -> 87 after kernel/concurrency.py went 57% -> 91% (measured total: 88%).
# 87 -> 90 after the audit release: ~40 fixes, each with regression tests and a
# mutant, took the measured total to 92%. Left two points of slack so an honest
# refactor that moves code between covered and uncovered branches does not fail
# the build, while a real drop does.
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",            # Protocol method bodies
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.12"
strict = true

# Optional third-party integrations are imported behind `try/except ImportError`.
# When the extra isn't installed there's no stub to load — that's the whole
# point of the guard, not a real type error. When the extra IS installed but
# ships no py.typed marker (asyncpg, orjson, older opentelemetry), mypy would
# otherwise refuse; same treatment applies.
[[tool.mypy.overrides]]
module = [
    "pydantic",
    "pydantic.*",
    "asyncpg",
    "asyncpg.*",
    "orjson",
    "redis",
    "redis.*",
    "opentelemetry",
    "opentelemetry.*",
    "pgvector",
    "pgvector.*",
    # attrs may or may not be installed (it's an optional shape supported by
    # ``capabilities/output_schema``, and also comes in transitively via the
    # ``mcp`` extra). Treat it as untyped either way so a strict typecheck
    # doesn't flip behavior based on which extras happen to be present.
    "attrs",
    "attrs.*",
]
ignore_missing_imports = true

# The adapter modules carry `# type: ignore[import-not-found]` on their
# guarded optional imports. Whether those ignores are "used" depends on
# which extras are installed at typecheck time — CI installs everything
# (so they read as unused), a bare install has none (so they're needed).
# Disable warn_unused_ignores here to make the check pass in both worlds.
[[tool.mypy.overrides]]
module = [
    "agentkit.adapters.*",
    "agentkit.capabilities.output_schema.*",
    "agentkit.integrations.mcp.*",
    "agentkit.kernel._json",
]
warn_unused_ignores = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "mcp>=1.28,<2",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10.9",
]
