name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Action majors are bumped together and deliberately: GitHub forced every
# Node-20 action onto Node 24, which surfaced as a deprecation annotation on
# every run. Our usage of each is limited to long-stable inputs
# (checkout: fetch-depth; upload-artifact: name/path/if-no-files-found/
# retention-days; setup-uv: enable-cache/cache-dependency-glob), so the major
# jumps carry no interface change for us. The PyPI publish action stays
# SHA-pinned rather than tag-pinned — it holds signing authority.

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Verify the mutant catalogue is not stale
        run: uv run python scripts/mutants.py --verify

      - name: Test with coverage
        # `coverage report` exits non-zero below `fail_under` (pyproject).
        # Previously coverage was measured and the result discarded, so a
        # regression was invisible.
        run: |
          uv run --with coverage coverage run -m pytest
          uv run --with coverage coverage xml -o coverage.xml
          uv run --with coverage coverage report

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  mutants:
    name: mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - run: uv python install 3.12
      - run: uv sync --all-extras
      # A surviving mutant means a catalogued invariant is not actually
      # enforced by any test. That is a review finding, not a nit.
      - name: Run the mutant catalogue
        run: uv run python scripts/mutants.py
