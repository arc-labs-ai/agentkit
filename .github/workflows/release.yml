name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheel + sdist
        run: |
          rm -rf dist
          uv build

      - name: Verify distributions with twine
        run: uv run --with twine twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to PyPI (OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/arc-agentkit
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI via trusted publisher
        # SHA-pinned (currently v1.14.2 — https://github.com/pypa/gh-action-pypi-publish/tree/release/v1)
        # This action holds signing authority via OIDC; pin to a commit, not a moving tag.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
